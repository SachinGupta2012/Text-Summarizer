[tool.uv.workspace]
members = ["services/api", "ml"]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["services/api/src", "ml/src"]
exclude = ["legacy/"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=summarizer_api --cov=summarizer_ml --cov-report=term-missing"
testpaths = ["services/api/tests", "ml/tests"]
pythonpath = ["services/api/src", "ml/src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
