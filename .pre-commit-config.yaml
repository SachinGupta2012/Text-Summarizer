repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: prettier
        name: Prettier check
        entry: pnpm format:check
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        pass_filenames: false
