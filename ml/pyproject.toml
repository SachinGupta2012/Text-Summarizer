[project]
name = "summarizer-ml"
version = "0.1.0"
description = "Reproducible ML lifecycle package for transformer summarization"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summarizer_ml"]
